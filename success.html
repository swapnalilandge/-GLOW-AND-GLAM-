</head>
<body>

<nav>

<script>
let order = "GG" + Math.floor(Math.random() * 1000000);

document.getElementById("orderId").innerHTML =
"Order ID: " + order;

let today = new Date();
today.setDate(today.getDate() + 5);

document.getElementById("deliveryDate").innerHTML =
"Estimated Delivery: " + today.toDateString();
</script>
